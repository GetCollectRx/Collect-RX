# fly.toml app configuration file generated for collect-rx-audit-sidecar on 2026-08-02T06:29:04-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'collect-rx-audit-sidecar'
primary_region = 'yyz'

[build]
[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  ports = []

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
