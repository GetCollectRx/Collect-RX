# fly.toml — guardrail audit sidecar (collect-rx-audit-sidecar).
#
# Internal-only service. It receives call-transcript text (PHI) from the main
# app's guardrail worker and must NEVER be publicly reachable: there is no
# [http_service] and no public [[services.ports]]. The main app reaches it over
# Fly private networking at http://collect-rx-audit-sidecar.internal:8000.
#
# Region is pinned to yyz (Toronto) for PHIPA/PIPEDA data residency — same as
# the main app. Do not run this in a US region.
#
# This is a starting config. Reconcile against the live schema with
# `fly config validate` (and `fly launch --no-deploy` on first create) before
# relying on it. See DEPLOY.md in this directory.

app = 'collect-rx-audit-sidecar'
primary_region = 'yyz'

[build]
  # Uses ./Dockerfile (python:3.11-slim, uvicorn on :8000).

[env]
  PORT = '8000'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

# Private TCP service — no `ports` block, so Fly assigns no public IP.
# Guardrail audit is off the request path (worker drains an outbox every 60s),
# so cold starts are acceptable; machines autostop when idle to save cost.
# For always-warm behaviour set min_machines_running = 1.
[[services]]
  internal_port = 8000
  protocol = 'tcp'
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
