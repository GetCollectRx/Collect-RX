# Automatically promotes dev to prd once CollectRx CI is green on dev.
#
# This opens (or reuses) a dev -> prd pull request and enables GitHub's
# native auto-merge on it, rather than pushing directly to prd. That way
# promotion still respects whatever branch protection prd has today or
# gains later (required reviews, required status checks) instead of
# silently bypassing it, while still merging with zero human click once
# everything required is green.
#
# One-time manual setup this workflow depends on (not configurable via
# the GitHub API used here):
#   1. Repo Settings -> General -> "Allow auto-merge" must be enabled.
#   2. If prd has branch protection requiring reviews, either add an
#      exception for github-actions[bot] or accept that auto-merge will
#      wait indefinitely for a human approval on top of green CI.
#   3. If prd has required status checks configured, they must match
#      job names produced by CollectRx CI (now triggered on PRs into
#      prd too — see the trigger change in collectrx-ci.yml).
name: Auto-promote dev to prd

on:
  workflow_run:
    workflows: ["CollectRx CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-promote-dev-to-prd
  cancel-in-progress: false

jobs:
  promote:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against a superseded CI run
        id: guard
        run: |
          git fetch origin dev prd
          if [ "$(git rev-parse origin/dev)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "dev has advanced since this CI run (${{ github.event.workflow_run.head_sha }}) — a newer run will handle promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor origin/dev origin/prd; then
            echo "prd is already up to date with dev — nothing to promote."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open (or reuse) the promotion PR and enable auto-merge
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --base prd --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr create \
              --base prd --head dev \
              --title "Auto-promote dev to prd ($(date -u +%Y-%m-%dT%H:%MZ))" \
              --body "Automatic promotion — CollectRx CI passed on \`dev\` at \`${{ github.event.workflow_run.head_sha }}\`. This PR merges automatically once prd's required checks/reviews (if any) are satisfied." \
              | grep -oE '[0-9]+$')"
          fi
          gh pr merge "$PR_NUMBER" --auto --merge

      - name: Notify ops on promotion failure
        if: failure() && env.OPS_ALERT_WEBHOOK_URL != ''
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$OPS_ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"dev to prd auto-promotion failed for commit ${{ github.event.workflow_run.head_sha }} — needs manual merge.\"}"
