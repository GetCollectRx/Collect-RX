# Builds CollectRx desktop installers from the workspace package `Collect-RX-main`.
# Artifacts: GitHub Actions → run summary → Artifacts (retention 30 days).
# Tagged pushes (v*): also attach installers to a GitHub Release.

name: CollectRx Electron installers

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'Collect-RX-main/**'
      - 'package-lock.json'
      - '.github/workflows/collectrx-electron-installers.yml'
  # Electron builds (~15 min, macOS+Windows) run on release tags and manual dispatch only.
  # Every push to main is validated by CollectRx CI (typecheck + tests, ~2 min).

concurrency:
  group: collectrx-electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Prisma datasource is PostgreSQL — CI must not use sqlite/file URLs.
# Do NOT set NODE_ENV=production for the whole workflow: npm ci would omit devDependencies
# (TypeScript, Vite, Prisma CLI, electron-builder), breaking install ~30s in. Set NODE_ENV
# only on build/package steps. JWT/Vapi placeholders remain for tooling that reads them.
env:
  DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
  JWT_SECRET: github-actions-ci-placeholder-not-for-production
  VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  mac-zip:
    name: macOS (ZIP — contains .app; avoids DMG gettext tooling)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Prisma, TypeScript, Vite build
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
        run: npm run db:generate && npm run typecheck && npx --no-install -p vite vite build

      - name: Package macOS installers
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
          COPYFILE_DISABLE: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install -p electron-builder electron-builder --mac --publish never

      - name: List dist-electron (debug)
        if: failure() || cancelled()
        run: ls -laR Collect-RX-main/dist-electron || true

      - name: Stage macOS zip artifacts
        run: |
          mkdir -p _artifacts_mac
          find Collect-RX-main/dist-electron -name '*.zip' -exec cp -f {} _artifacts_mac/ \;
          find Collect-RX-main/dist-electron -maxdepth 1 -name '*.yml' -exec cp -f {} _artifacts_mac/ \;
          find Collect-RX-main/dist-electron -maxdepth 1 -name '*.blockmap' -exec cp -f {} _artifacts_mac/ \;
          ls -la _artifacts_mac
          test "$(find _artifacts_mac -name '*.zip' | wc -l | tr -d ' ')" -ge 1

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CollectRx-mac-zip
          path: _artifacts_mac/*
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _artifacts_mac/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-exe:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Prisma, TypeScript, Vite build
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
        run: npm run db:generate && npm run typecheck && npx --no-install -p vite vite build

      - name: Package Windows installer
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install -p electron-builder electron-builder --win --x64 --publish never

      - name: List dist-electron (debug)
        if: failure() || cancelled()
        shell: pwsh
        run: Get-ChildItem -Recurse Collect-RX-main/dist-electron -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Stage Windows exe artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _artifacts_win | Out-Null
          Get-ChildItem -Path Collect-RX-main/dist-electron -Recurse -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName _artifacts_win -Force
          }
          Get-ChildItem -Path Collect-RX-main/dist-electron -Filter *.yml -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName _artifacts_win -Force
          }
          Get-ChildItem -Path Collect-RX-main/dist-electron -Filter *.blockmap -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName _artifacts_win -Force
          }
          Get-ChildItem _artifacts_win
          if (-not (Get-ChildItem _artifacts_win -Filter *.exe)) { throw 'No .exe produced under dist-electron' }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CollectRx-windows-installer
          path: _artifacts_win/*
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _artifacts_win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-appimage:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Prisma, TypeScript, Vite build
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
        run: npm run db:generate && npm run typecheck && npx --no-install -p vite vite build

      - name: Package Linux installers
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install -p electron-builder electron-builder --linux --publish never

      - name: Stage Linux artifacts
        run: |
          mkdir -p _artifacts_linux
          find Collect-RX-main/dist-electron -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.blockmap' \) -exec cp -f {} _artifacts_linux/ \;
          ls -la _artifacts_linux
          test "$(find _artifacts_linux -type f | wc -l | tr -d ' ')" -ge 1

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CollectRx-linux
          path: _artifacts_linux/*
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _artifacts_linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
