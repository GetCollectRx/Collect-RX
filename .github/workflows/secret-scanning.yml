name: Secret Scanning & Protection

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  secret-detection:
    runs-on: ubuntu-latest
    name: Detect exposed secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TruffleHog for secret detection
      - name: Secret scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json
          continue-on-error: false

      # GitGuardian scanning (if using their service)
      # - name: GitGuardian scan
      #   uses: GitGuardian/ggshield-action@master
      #   with:
      #     API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      #     GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
      #     GITHUB_PUSH_AFTER_SHA: ${{ github.sha }}
      #     GITHUB_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      #     GITHUB_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Ensure no hardcoded secrets in environment variable examples
  validate-env-examples:
    runs-on: ubuntu-latest
    name: Validate .env.example files
    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example files
        run: |
          echo "Checking for actual secret values in .env.example files..."

          # Check for Stripe live keys
          if grep -r "sk_live_" .env.example Collect-RX-main/.env.example; then
            echo "ERROR: Production Stripe keys found in .env.example"
            exit 1
          fi

          # Check for hardcoded JWT secrets (should be placeholders)
          if grep -E "JWT_SECRET=[a-f0-9]{64}" .env.example Collect-RX-main/.env.example 2>/dev/null; then
            echo "ERROR: Hardcoded JWT secrets found"
            exit 1
          fi

          # Check for actual API key patterns (exclude test keys)
          if grep -E "VAPI_API_KEY=sk-[a-zA-Z0-9]+" Collect-RX-main/.env.example; then
            echo "ERROR: Actual Vapi API keys found"
            exit 1
          fi

          echo "✓ .env.example files validated"

  # Verify environment variable usage
  check-env-variables:
    runs-on: ubuntu-latest
    name: Verify proper env var usage
    steps:
      - uses: actions/checkout@v4

      - name: Search for hardcoded secrets in source
        run: |
          echo "Searching for hardcoded secrets in source code..."

          # Patterns to find hardcoded secrets
          PATTERNS=(
            "sk_live_[A-Za-z0-9_]*"      # Stripe live key
            "sk_test_[a-zA-Z0-9_]*"      # Stripe test key (should be in env vars)
            "whsec_[a-zA-Z0-9_]*"        # Stripe webhook secret
            "sg_[A-Za-z0-9_]{20,}"       # SendGrid key pattern
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -r "$pattern" src/ Collect-RX-main/src/ --include="*.ts" --include="*.js" 2>/dev/null | grep -v "process.env" | grep -v "test" | grep -v ".env.example"; then
              echo "WARNING: Potential hardcoded secret pattern found: $pattern"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ $FOUND -gt 0 ]; then
            echo "Review findings above and ensure they are not actual secrets"
          else
            echo "✓ No obvious hardcoded secrets found"
          fi
