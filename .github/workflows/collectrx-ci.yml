# Fast checks on every push/PR (no Electron — avoids macOS/Windows minutes).
name: CollectRx CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: collectrx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
  JWT_SECRET: github-actions-ci-placeholder-not-for-production
  VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      # Do not use `npx prisma` — it can resolve to Prisma 7+ and break Prisma 5 schemas. Use the workspace script.
      - name: Prisma generate
        working-directory: Collect-RX-main
        run: npm run db:generate

      - name: Typecheck
        working-directory: Collect-RX-main
        run: npm run typecheck

      - name: Unit & integration tests
        working-directory: Collect-RX-main
        run: npm test
