# Fast checks on every push/PR (no Electron — avoids macOS/Windows minutes).
name: CollectRx CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: collectrx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
  JWT_SECRET: github-actions-ci-placeholder-not-for-production
  VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      # Do not use `npx prisma` — it can resolve to Prisma 7+ and break Prisma 5 schemas. Use the workspace script.
      - name: Prisma generate
        working-directory: Collect-RX-main
        run: npm run db:generate

      - name: Prisma migrate deploy
        working-directory: Collect-RX-main
        run: npm run db:migrate

      - name: Grant CI test role RLS bypass (integration tests use platform-level DB access)
        run: psql "$DATABASE_URL" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Typecheck
        working-directory: Collect-RX-main
        run: npm run typecheck

      - name: Lint
        working-directory: Collect-RX-main
        run: npm run lint

      - name: Production build
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
        run: npx vite build

      - name: Unit & integration tests
        working-directory: Collect-RX-main
        env:
          CI: "true"
        run: npm test

      - name: Upload test report (JUnit)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: Collect-RX-main/test-results/junit.xml
          if-no-files-found: ignore

      - name: Notify ops (CI failure)
        if: failure() && env.OPS_ALERT_WEBHOOK_URL != ''
        working-directory: Collect-RX-main
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci-notify-failure.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate
        working-directory: Collect-RX-main
        run: npm run db:generate && npm run db:migrate

      - name: Grant CI test role RLS bypass
        run: psql "$DATABASE_URL" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Build frontend
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
        run: npx vite build

      - name: Install Playwright Chromium
        working-directory: Collect-RX-main
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: Collect-RX-main
        env:
          CI: "true"
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
          JWT_SECRET: github-actions-ci-placeholder-not-for-production
          VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
        run: npm run e2e:ci

  perf-smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: grafana/setup-k6-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate
        working-directory: Collect-RX-main
        run: npm run db:generate && npm run db:migrate

      - name: Grant CI test role RLS bypass
        run: psql "$DATABASE_URL" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Build frontend
        working-directory: Collect-RX-main
        env:
          NODE_ENV: production
        run: npx vite build

      - name: Start API and run k6 read-heavy smoke
        working-directory: Collect-RX-main
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
          JWT_SECRET: github-actions-ci-placeholder-not-for-production
          VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
          PORT: "3000"
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          k6 run perf/k6-read-heavy.js
