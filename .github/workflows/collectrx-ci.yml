# Fast checks on every push/PR (no Electron — avoids macOS/Windows minutes).
name: CollectRx CI

on:
  workflow_dispatch:
  push:
    # Every pushed branch, not only main and dev: the gates must run wherever work lands.
    branches: ['**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: collectrx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # connection_limit/pool_timeout: Prisma's default pool (num_cpus*2+1) is too
  # small for tests/dsoHttpLoadCapacity.test.ts's 20 concurrent authenticated
  # sessions x 2 requests each on GitHub's 2-core runners — confirmed directly
  # (PrismaClientKnownRequestError: "Unable to start a transaction in the
  # given time" on the audit-log write, which fails closed rather than
  # degrading silently). See SHIPPABILITY-BACKLOG.md P1-01.
  DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public&connection_limit=30&pool_timeout=20
  JWT_SECRET: github-actions-ci-placeholder-not-for-production
  VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # A push to a branch that has an open pull request is covered by the pull_request run of the
  # same commit, so running both only doubles the cost and fills the history with cancelled runs.
  # Pushes still run when no open pull request exists (the gates must run wherever work lands),
  # when the pull request has merge conflicts (GitHub does not start pull_request runs then), and
  # whenever this lookup is unsure: it fails open, never closed.
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this push duplicates a pull_request run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run=true
          if [ "$EVENT_NAME" = "push" ]; then
            numbers="$(gh api -X GET "repos/${REPO}/pulls" -f state=open -f head="${OWNER}:${BRANCH}" -f per_page=10 \
              --jq '.[] | select(.base.ref == "main" or .base.ref == "dev") | .number' 2>/dev/null || true)"
            for number in $numbers; do
              state="$(gh api "repos/${REPO}/pulls/${number}" --jq '.mergeable_state' 2>/dev/null || echo unknown)"
              if [ "$state" = "unknown" ] || [ -z "$state" ] || [ "$state" = "null" ]; then
                sleep 5
                state="$(gh api "repos/${REPO}/pulls/${number}" --jq '.mergeable_state' 2>/dev/null || echo unknown)"
              fi
              case "$state" in
                dirty|unknown|null|"") ;;
                *) run=false ;;
              esac
            done
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "Run the jobs for this event: ${run}"

  branch-up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch is up to date with ${{ github.base_ref }}
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          if ! git merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD; then
            behind="$(git rev-list --count HEAD.."origin/${{ github.base_ref }}")"
            echo "::error::This branch is $behind commit(s) behind '${{ github.base_ref }}'. Merge or rebase '${{ github.base_ref }}' into this branch before merging — a stale branch can reintroduce dependency vulnerabilities or build fixes that were already patched on '${{ github.base_ref }}' (this is what caused PR #59 to fail npm audit on already-fixed js-yaml/react-router advisories)."
            exit 1
          fi
          echo "Branch is up to date with ${{ github.base_ref }}."

  verify:
    runs-on: ubuntu-latest
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      # Pull requests block on critical advisories only. A newly published advisory against an
      # unchanged lockfile must not stop unrelated work overnight. .github/workflows/dependency-audit.yml
      # audits at the stricter high threshold every week. scripts/check-gate-parity.sh keeps this
      # level equal to the one verify-all.sh uses.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=critical

      # Do not use `npx prisma` — it can resolve to Prisma 7+ and break Prisma 5 schemas. Use the workspace script.
      - name: Prisma generate
        run: npm run db:generate:collectrx

      - name: Prisma migrate deploy
        run: npm run db:migrate:collectrx

      - name: Grant CI test role RLS bypass (integration tests use platform-level DB access)
        run: psql "${DATABASE_URL%%\?*}" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Typecheck
        run: npm run typecheck:collectrx

      - name: Lint
        run: npm run lint:collectrx

      - name: Semgrep SAST
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" returntocorp/semgrep \
            semgrep --config=p/typescript --config=p/owasp-top-ten --error \
            /src/Collect-RX-main/src

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build:collectrx

      - name: Unit & integration tests
        env:
          CI: "true"
        run: npm run test:collectrx

      # Runs the exact command Railway runs on deploy (db:generate && tsc && check:api && vite build).
      # Typecheck above uses `tsc --noEmit` and never touches Vite, so a server-only import (Node
      # crypto, Prisma, PHI vault) leaking into the client bundle only failed on Railway, not here.
      - name: Production build (typecheck emit + API coverage + Vite build)
        working-directory: Collect-RX-main
        run: npm run build

      - name: Upload test report (JUnit)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: Collect-RX-main/test-results/junit.xml
          if-no-files-found: ignore

      - name: Notify ops (CI failure)
        if: failure() && env.OPS_ALERT_WEBHOOK_URL != ''
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node Collect-RX-main/scripts/ci-notify-failure.mjs

  queue-redis:
    runs-on: ubuntu-latest
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # See the workflow-level env block's comment on connection_limit above —
      # this job sets its own DATABASE_URL (adds REDIS_URL) so it needs the
      # same fix independently, not inherited from the workflow-level default.
      DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public&connection_limit=30&pool_timeout=20
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: github-actions-ci-placeholder-not-for-production
      VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
      NODE_OPTIONS: --max-old-space-size=6144
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate
        run: npm run db:generate:collectrx && npm run db:migrate:collectrx

      - name: Grant CI test role RLS bypass
        run: psql "${DATABASE_URL%%\?*}" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Tests with Redis (BullMQ queue paths)
        run: npm run test:collectrx
        env:
          # Override vitest env to enable Redis for this job only
          REDIS_URL: redis://127.0.0.1:6379

  e2e:
    runs-on: ubuntu-latest
    needs: [trigger, verify]
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate
        run: npm run db:generate:collectrx && npm run db:migrate:collectrx

      - name: Grant CI test role RLS bypass
        run: psql "${DATABASE_URL%%\?*}" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Build frontend
        env:
          NODE_ENV: production
        run: npm run build:collectrx

      - name: Install Playwright Chromium
        run: npm exec --workspace=dental-ar-system -- playwright install --with-deps chromium

      - name: Playwright E2E
        env:
          CI: "true"
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
          JWT_SECRET: github-actions-ci-placeholder-not-for-production
          VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
        run: npm exec --workspace=dental-ar-system -- playwright test

  perf-smoke:
    runs-on: ubuntu-latest
    needs: [trigger, verify]
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: grafana/setup-k6-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate
        run: npm run db:generate:collectrx && npm run db:migrate:collectrx

      - name: Grant CI test role RLS bypass
        run: psql "${DATABASE_URL%%\?*}" -c "ALTER ROLE prisma BYPASSRLS;"

      - name: Build frontend
        env:
          NODE_ENV: production
        run: npm run build:collectrx

      - name: Start API and run k6 read-heavy smoke
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
          JWT_SECRET: github-actions-ci-placeholder-not-for-production
          VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
          PORT: "3000"
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          k6 run Collect-RX-main/perf/k6-read-heavy.js

  rls-strict:
    runs-on: ubuntu-latest
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate + migrate
        run: npm run db:generate:collectrx && npm run db:migrate:collectrx
      - name: Verify every tenant table has RLS coverage (P0-03)
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
        run: npm exec --workspace=dental-ar-system -- node scripts/check-rls-coverage.mjs
      - name: Create non-superuser DB role for RLS enforcement
        run: |
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'collectrx_rls_tester') THEN
              CREATE ROLE collectrx_rls_tester LOGIN PASSWORD 'rls_test_ci' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO collectrx_rls_tester;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO collectrx_rls_tester;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO collectrx_rls_tester;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO collectrx_rls_tester;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO collectrx_rls_tester;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO collectrx_rls_tester;
          SQL
      - name: Enforce tenant RLS isolation
        env:
          CI: "true"
          COLLECTRX_RLS_TEST_STRICT: "1"
          RLS_SETUP_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
          DATABASE_URL: postgresql://collectrx_rls_tester:rls_test_ci@127.0.0.1:5432/prisma?schema=public
        run: npm exec --workspace=dental-ar-system -- vitest run tests/rls.strict.test.ts

  carrier-whitelist:
    runs-on: ubuntu-latest
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate + migrate
        run: npm run db:generate:collectrx && npm run db:migrate:collectrx
      - name: Grant isolated validation role RLS bypass
        run: psql "${DATABASE_URL%%\?*}" -c "ALTER ROLE prisma BYPASSRLS;"
      - name: Validate carrier whitelist dispatch gates
        run: npm run test:carrier-whitelist --workspace=dental-ar-system

  # Static gates that need no install and no database: no new any or suppressions, no new
  # TODO or FIXME, no irregular whitespace, no braces in schema comments, no protected paths.
  # The same script and gate ids the pre-push hook runs, so local and CI cannot disagree.
  static-gates:
    runs-on: ubuntu-latest
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --quiet origin "${BASE_BRANCH}" || true

      - name: Static gates
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: bash scripts/verify-all.sh --only env,scope,anyscan,todo,chars,schemadoc --base "origin/${BASE_BRANCH}"

      - name: Gate script self-tests
        run: |
          bash scripts/verify-all.selftest.sh
          bash scripts/check-pr-body.selftest.sh
          bash scripts/check-gate-parity.selftest.sh

  # Fails when the pre-push hook, verify-all.sh and the verify job above have drifted apart.
  gate-parity:
    runs-on: ubuntu-latest
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check hook, verify-all.sh and CI parity
        run: bash scripts/check-gate-parity.sh

  # The single status to require in branch protection for this workflow. It passes only when
  # every job above succeeded, or was skipped for a reason that is correct for this event.
  ci-gate:
    if: always()
    needs: [trigger, branch-up-to-date, static-gates, gate-parity, verify, queue-redis, rls-strict, carrier-whitelist, e2e, perf-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const event = process.env.EVENT_NAME;
            const deferred = needs.trigger.outputs.run === "false";
            let bad = 0;
            for (const [job, info] of Object.entries(needs)) {
              const r = info.result;
              // branch-up-to-date only exists for pull_request events. Everything is skipped when
              // this push defers to the pull_request run of the same commit.
              const okSkip = (job === "branch-up-to-date" && event !== "pull_request") || (deferred && job !== "trigger");
              const ok = r === "success" || (r === "skipped" && okSkip);
              console.log((ok ? "ok    " : "FAIL  ") + job + ": " + r);
              if (!ok) bad += 1;
            }
            if (deferred) console.log("note: this push defers to the pull_request run of the same commit");
            process.exit(bad ? 1 : 0);
          '
