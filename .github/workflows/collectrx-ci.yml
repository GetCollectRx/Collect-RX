# Fast checks on every push/PR (no Electron — avoids macOS/Windows minutes).
name: CollectRx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public
  JWT_SECRET: github-actions-ci-placeholder-not-for-production
  VAPI_WEBHOOK_SECRET: github-actions-ci-placeholder
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Collect-RX-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test
