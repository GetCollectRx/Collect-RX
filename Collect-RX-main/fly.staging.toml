# Staging Fly app template — collect-rx-staging
# Copy to fly.staging.toml and: fly apps create collect-rx-staging && fly deploy -c fly.staging.toml

app = 'collect-rx-staging'
primary_region = 'yyz'

[build]

[deploy]
release_command = 'npx prisma migrate deploy'

# Live sandbox (docs/operations/STAGING-SANDBOX.md). SANDBOX_MODE blocks every
# outbound call and message and plays carrier calls through the in-process
# simulator. Changing SANDBOX_RESET_TOKEN to a new value wipes this app's
# database once, on the next boot, and recreates the two synthetic practices.
[env]
SANDBOX_MODE = '1'
SANDBOX_RESET_TOKEN = '2026-11-07-initial'
BILLING_SKIP_PRACTICE_IDS = '5a0d0000-0000-4000-8000-0000000000a1,5a0d0000-0000-4000-8000-0000000000a2'

[processes]
app = 'npm run start'
worker = 'npm run worker'

[http_service]
internal_port = 3000
force_https = true
# The queue engine and the carrier simulator run in the app process, so it
# stays up for calls to be scheduled and played in real time.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = '30s'
timeout = '10s'
grace_period = '60s'
method = 'GET'
path = '/api/health/ready'

[[services]]
internal_port = 3000
protocol = 'tcp'
processes = ['worker']
auto_stop_machines = false
min_machines_running = 1

  [[services.http_checks]]
  interval = '30s'
  timeout = '10s'
  grace_period = '60s'
  method = 'GET'
  path = '/api/health/ready'

[[vm]]
processes = ['app']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[[vm]]
processes = ['worker']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

# Secrets (set separately — never commit):
# fly secrets set -a collect-rx-staging DATABASE_URL=... REDIS_URL=... JWT_SECRET=...
# Use Stripe TEST keys, SendGrid sandbox, synthetic data only.
