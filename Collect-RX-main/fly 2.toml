app = "collect-rx"
primary_region = "yyz"

[http_service]
  auto_start_machines  = true
  auto_stop_machines   = true
  force_https          = true
  internal_port        = 3000
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "10s"
    grace_period = "30s"
    method       = "GET"
    path         = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
