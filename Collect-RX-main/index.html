    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=DM+Mono:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ── CollectRx Design System ──────────────────────────────────────────────
      // Primary: #0f9d58 — matches marketing site editorial green
      // Source of truth: src/styles/brandTokens.css + tailwind.config.ts
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              crx: {
                50:  '#f0faf5',
                100: '#d6f0e4',
                200: '#a8dfc8',
                300: '#6ec9a4',
                400: '#2db872',
                500: '#0f9d58',
                600: '#0b5b47',
                700: '#094938',
                800: '#063629',
                900: '#042419',
                950: '#021410',
              },
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['Source Serif 4', 'Georgia', 'Times New Roman', 'serif'],
              mono: ['DM Mono', 'ui-monospace', 'monospace'],
            },
            fontSize: {
              '2xs': ['0.625rem', { lineHeight: '0.875rem' }],
            },
            borderRadius: {
              'xl':  '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
            },
            boxShadow: {
              'card':       '0 1px 3px 0 rgb(0 0 0 / 0.07), 0 1px 2px -1px rgb(0 0 0 / 0.07)',
              'card-hover': '0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.08)',
              'modal':      '0 20px 25px -5px rgb(0 0 0 / 0.12), 0 8px 10px -6px rgb(0 0 0 / 0.08)',
              'sidebar':    '1px 0 0 0 rgb(0 0 0 / 0.06)',
            },
            transitionTimingFunction: {
              'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            keyframes: {
              'fade-in': {
                from: { opacity: '0', transform: 'translateY(4px)' },
                to:   { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-in': {
                from: { opacity: '0', transform: 'translateX(-8px)' },
                to:   { opacity: '1', transform: 'translateX(0)' },
              },
              'spin-slow': {
                to: { transform: 'rotate(360deg)' },
              },
            },
            animation: {
              'fade-in':  'fade-in 0.2s ease-out both',
              'slide-in': 'slide-in 0.2s ease-out both',
              'spin-slow': 'spin-slow 0.8s linear infinite',
            },
          },
        },
      }

      // Apply persisted theme on first paint (prevents flash)
      ;(function () {
        const stored = localStorage.getItem('crx-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
