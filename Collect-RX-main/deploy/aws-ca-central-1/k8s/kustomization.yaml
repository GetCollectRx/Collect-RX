apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: collectrx
resources:
  - namespace.yaml
  - configmap.yaml
  - external-secret.yaml
  - deployment-app.yaml
  - deployment-worker.yaml
  - service.yaml
  - networkpolicy.yaml
# Set the real ECR image before applying:
#   cd deploy/aws-ca-central-1/k8s
#   kustomize edit set image collectrx=<account-id>.dkr.ecr.ca-central-1.amazonaws.com/collectrx:<tag>
images:
  - name: collectrx
    newName: collectrx
    newTag: latest
