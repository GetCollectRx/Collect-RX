# Requires the External Secrets Operator and a ClusterSecretStore named
# "aws-secrets-manager-ca-central-1" whose provider region is ca-central-1.
# Secret names below are the Secrets Manager keys to create; values are never in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: collectrx-secrets
  namespace: collectrx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-ca-central-1
  target:
    name: collectrx-secrets
    creationPolicy: Owner
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: collectrx/production/DATABASE_URL } }
    - { secretKey: REDIS_URL, remoteRef: { key: collectrx/production/REDIS_URL } }
    - { secretKey: PHI_ENCRYPTION_KEY, remoteRef: { key: collectrx/production/PHI_ENCRYPTION_KEY } }
    - { secretKey: JWT_SECRET, remoteRef: { key: collectrx/production/JWT_SECRET } }
    - { secretKey: VAPI_API_KEY, remoteRef: { key: collectrx/production/VAPI_API_KEY } }
    - { secretKey: VAPI_WEBHOOK_SECRET, remoteRef: { key: collectrx/production/VAPI_WEBHOOK_SECRET } }
    - { secretKey: SENDGRID_API_KEY, remoteRef: { key: collectrx/production/SENDGRID_API_KEY } }
    - { secretKey: STRIPE_SECRET_KEY, remoteRef: { key: collectrx/production/STRIPE_SECRET_KEY } }
    - { secretKey: STRIPE_WEBHOOK_SECRET, remoteRef: { key: collectrx/production/STRIPE_WEBHOOK_SECRET } }
