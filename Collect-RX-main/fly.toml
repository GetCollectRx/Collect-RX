# fly.toml app configuration for collect-rx.
# Written to match the live config (`fly config show -a collect-rx`).
# This file is the source of truth going forward; keep it in sync with
# `fly config show -a collect-rx`.
# See https://fly.io/docs/reference/configuration/
#
# Process groups:
# app - serves HTTP traffic, autostop/autostart, min 1 running.
# worker - background job/queue worker (Dockerfile.worker), runs
# `npm run worker` (same BullMQ entrypoint). Always on. Not
# referenced in [http_service].processes so autostop does not
# apply to it.
#
# Redis: app and worker share one REDIS_URL (BullMQ requires producer and
# consumer on the same Redis instance) per
# docs/adr/0002-background-jobs-bullmq-redis.md. There is no separate
# dedicated worker Redis, and none is needed here.
#
# Log volumes: logs/app-YYYY-MM-DD.log (Winston, src/logger.cjs) previously
# lived only on the container's ephemeral filesystem and was lost on every
# redeploy/restart. Each process group gets its own volume — a Fly volume
# attaches to exactly one machine, and app/worker are separate machines.
# Before first deploy with this config, provision both volumes:
#   fly volumes create collectrx_app_logs -a collect-rx -r yyz --size 1
#   fly volumes create collectrx_worker_logs -a collect-rx -r yyz --size 1
# Caveat: a volume-backed machine can't be freely multi-region/multi-instance
# scaled without a volume per instance — fine at current min_machines_running
# = 1, revisit if the app process group ever scales beyond one machine.

app = 'collect-rx'
primary_region = 'yyz'

[build]

[deploy]
# Runs as a one-off machine before the new release rolls out; a nonzero
# exit blocks the deploy. Seeds demo data for the demo environment.
release_command = 'npx prisma migrate deploy && npm run demo:seed'

[processes]
app = 'npm run start'
worker = 'npm run worker'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = '15s'
timeout = '10s'
grace_period = '30s'
method = 'GET'
path = '/api/health/ready'

[[vm]]
processes = ['app']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[[vm]]
processes = ['worker']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

# Volume mounts temporarily disabled for demo deployment
# [[mounts]]
# source = 'collectrx_app_logs'
# destination = '/app/logs'
# processes = ['app']

# [[mounts]]
# source = 'collectrx_worker_logs'
# destination = '/app/logs'
# processes = ['worker']
