# fly.toml app configuration for collect-rx.
# Written to match the live config (`fly config show -a collect-rx`).
# This file is the source of truth going forward; keep it in sync with
# `fly config show -a collect-rx`.
# See https://fly.io/docs/reference/configuration/
#
# Process groups:
# app - serves HTTP traffic, autostop/autostart, min 1 running.
# worker - background job/queue worker (parity with Railway's
# collectrx-worker service / Dockerfile.worker), runs
# `npm run worker` (same BullMQ entrypoint). Always on. Not
# referenced in [http_service].processes so autostop does not
# apply to it.
#
# Redis: app and worker share one REDIS_URL (BullMQ requires producer and
# consumer on the same Redis instance). This matches Railway's architecture
# per docs/adr/0002-background-jobs-bullmq-redis.md. There is no separate
# dedicated worker Redis on either platform, and none is needed here.

app = 'collect-rx'
primary_region = 'yyz'

[build]

[deploy]
# Parity with railway.toml's releaseCommand. Runs as a one-off machine
# before the new release rolls out; a nonzero exit blocks the deploy.
release_command = 'npx prisma migrate deploy'

[processes]
app = 'npm run start'
worker = 'npm run worker'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = '15s'
timeout = '10s'
grace_period = '30s'
method = 'GET'
path = '/api/health'

[[vm]]
processes = ['app']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[[vm]]
processes = ['worker']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
