# Staging Fly app template — collect-rx-staging
# Copy to fly.staging.toml and: fly apps create collect-rx-staging && fly deploy -c fly.staging.toml

app = 'collect-rx-staging'
primary_region = 'yyz'

[build]

[deploy]
release_command = 'npx prisma migrate deploy'

[processes]
app = 'npm run start'
worker = 'npm run worker'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
interval = '30s'
timeout = '10s'
grace_period = '60s'
method = 'GET'
path = '/api/health'

[[vm]]
processes = ['app']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[[vm]]
processes = ['worker']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

# Secrets (set separately — never commit):
# fly secrets set -a collect-rx-staging DATABASE_URL=... REDIS_URL=... JWT_SECRET=...
# Use Stripe TEST keys, SendGrid sandbox, synthetic data only.
