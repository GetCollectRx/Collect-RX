app = 'collectrx-carrier-twin'
primary_region = 'yyz'

[build]

[env]
  PORT = '8080'
  PUBLIC_BASE_URL = 'https://collectrx-carrier-twin.fly.dev'
  # Shortens holds so a test call costs minutes. Remove for a full-length hold run.
  TWIN_HOLD_SECONDS = '90'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
