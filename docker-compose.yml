# Local PostgreSQL + Redis + ClickHouse for CollectRx.
# Usage: docker compose up -d
# Host port 5433 avoids clashing with a native Postgres install on 5432 (Homebrew, Postgres.app).
# Redis on 6379 — set REDIS_URL=redis://127.0.0.1:6379 in .env for npm run worker.
# ClickHouse on 8123 (HTTP) and 9000 (native) — set CLICKHOUSE_URL=http://localhost:8123 in .env

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: collectrx
      POSTGRES_PASSWORD: collectrx_local_dev_only
      POSTGRES_DB: collectrx
    volumes:
      - collectrx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectrx -d collectrx"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"   # HTTP interface (used by @clickhouse/client)
      - "9000:9000"   # Native TCP interface
    environment:
      CLICKHOUSE_DB: collectrx_analytics
      CLICKHOUSE_USER: collectrx
      CLICKHOUSE_PASSWORD: collectrx_ch_dev_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - collectrx_chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  collectrx_pgdata:
  collectrx_chdata:
