<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CollectRx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ============================================
       COLLECTRX DESIGN SYSTEM
       Inspired by Linear, Stripe, Notion
       Primary: #0F6E56
    ============================================ */

    :root {
      /* Brand Colors */
      --brand-primary: #0F6E56;
      --brand-primary-hover: #0A5A46;
      --brand-primary-light: #E8F5F1;
      --brand-primary-muted: rgba(15, 110, 86, 0.1);

      /* Neutrals */
      --gray-50: #FAFAFA;
      --gray-100: #F4F4F5;
      --gray-200: #E4E4E7;
      --gray-300: #D4D4D8;
      --gray-400: #A1A1AA;
      --gray-500: #71717A;
      --gray-600: #52525B;
      --gray-700: #3F3F46;
      --gray-800: #27272A;
      --gray-900: #18181B;

      /* Semantic */
      --success: #10B981;
      --success-light: #D1FAE5;
      --warning: #F59E0B;
      --warning-light: #FEF3C7;
      --danger: #EF4444;
      --danger-light: #FEE2E2;
      --info: #3B82F6;
      --info-light: #DBEAFE;

      /* Aging Colors */
      --age-current: #10B981;
      --age-30: #F59E0B;
      --age-60: #EF4444;

      /* Layout */
      --sidebar-width: 240px;
      --header-height: 56px;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);

      /* Transitions */
      --transition-fast: 100ms ease;
      --transition-base: 150ms ease;
      --transition-slow: 300ms ease;

      /* Border Radius */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================================
       LAYOUT
    ============================================ */

    .app-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--gray-900);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--gray-800);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--brand-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      color: white;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      color: white;
      letter-spacing: -0.3px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-500);
      padding: 8px 12px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      color: var(--gray-400);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: var(--gray-800);
      color: var(--gray-200);
    }

    .nav-item.active {
      background: var(--brand-primary);
      color: white;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--gray-800);
    }

    .practice-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--gray-800);
      border-radius: var(--radius-md);
      cursor: pointer;
    }

    .practice-avatar {
      width: 32px;
      height: 32px;
      background: var(--brand-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 12px;
    }

    .practice-info {
      flex: 1;
      min-width: 0;
    }

    .practice-name {
      font-size: 13px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .practice-detail {
      font-size: 11px;
      color: var(--gray-500);
    }

    /* ============================================
       MAIN CONTENT
    ============================================ */

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-header {
      padding: 24px 32px 0;
      background: white;
      border-bottom: 1px solid var(--gray-200);
    }

    .page-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--gray-900);
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 32px;
    }

    /* ============================================
       CARDS & METRICS
    ============================================ */

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: box-shadow var(--transition-base);
    }

    .metric-card:hover {
      box-shadow: var(--shadow-sm);
    }

    .metric-card.highlight {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
    }

    .metric-card.highlight .metric-label,
    .metric-card.highlight .metric-value,
    .metric-card.highlight .metric-change {
      color: white;
    }

    .metric-card.highlight .metric-label {
      opacity: 0.8;
    }

    .metric-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-500);
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .metric-value.large {
      font-size: 36px;
    }

    .metric-change {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
    }

    .metric-change.positive {
      color: var(--success);
    }

    .metric-change.negative {
      color: var(--danger);
    }

    .metric-change.neutral {
      color: var(--gray-500);
    }

    .metric-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .split-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .split-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .split-card-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .split-card-icon.insurance {
      background: var(--info-light);
      color: var(--info);
    }

    .split-card-icon.patient {
      background: var(--brand-primary-light);
      color: var(--brand-primary);
    }

    .split-card-icon svg {
      width: 16px;
      height: 16px;
    }

    .split-card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-600);
    }

    .split-card-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 4px;
    }

    .split-card-detail {
      font-size: 12px;
      color: var(--gray-500);
    }

    /* ============================================
       SECTIONS & CARDS
    ============================================ */

    .section {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gray-200);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-900);
    }

    .section-content {
      padding: 0;
    }

    .section-content.padded {
      padding: 20px;
    }

    /* ============================================
       TABLES
    ============================================ */

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }

    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-500);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--gray-100);
      font-size: 13px;
      color: var(--gray-700);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background var(--transition-fast);
    }

    tbody tr:hover {
      background: var(--gray-50);
    }

    .cell-primary {
      font-weight: 600;
      color: var(--gray-900);
    }

    .cell-secondary {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 2px;
    }

    .cell-amount {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Age-based coloring */
    .age-current { color: var(--age-current); }
    .age-30 { color: var(--age-30); }
    .age-60 { color: var(--age-60); }

    .age-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .age-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .age-dot.current { background: var(--age-current); }
    .age-dot.warning { background: var(--age-30); }
    .age-dot.overdue { background: var(--age-60); }

    /* ============================================
       BADGES & STATUS
    ============================================ */

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-success {
      background: var(--success-light);
      color: #065F46;
    }

    .badge-warning {
      background: var(--warning-light);
      color: #92400E;
    }

    .badge-danger {
      background: var(--danger-light);
      color: #991B1B;
    }

    .badge-info {
      background: var(--info-light);
      color: #1E40AF;
    }

    .badge-neutral {
      background: var(--gray-100);
      color: var(--gray-600);
    }

    /* ============================================
       BUTTONS
    ============================================ */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
      font-family: inherit;
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .btn-primary {
      background: var(--brand-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--brand-primary-hover);
    }

    .btn-secondary {
      background: white;
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
    }

    .btn-secondary:hover {
      background: var(--gray-50);
      border-color: var(--gray-400);
    }

    .btn-ghost {
      background: transparent;
      color: var(--gray-600);
    }

    .btn-ghost:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #DC2626;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-icon {
      padding: 6px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    /* ============================================
       FORMS
    ============================================ */

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: inherit;
      transition: all var(--transition-fast);
      background: white;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-primary-muted);
    }

    .form-input::placeholder {
      color: var(--gray-400);
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--gray-400);
    }

    .search-input-wrapper .form-input {
      padding-left: 36px;
    }

    /* ============================================
       FILTERS & TOOLBAR
    ============================================ */

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gray-200);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
    }

    .filter-pill {
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--gray-100);
      color: var(--gray-600);
      border: none;
    }

    .filter-pill:hover {
      background: var(--gray-200);
    }

    .filter-pill.active {
      background: var(--brand-primary);
      color: white;
    }

    /* ============================================
       SUMMARY BAR
    ============================================ */

    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }

    .summary-stats {
      display: flex;
      gap: 24px;
    }

    .summary-stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .summary-stat-label {
      font-size: 12px;
      color: var(--gray-500);
    }

    .summary-stat-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-900);
    }

    .bulk-actions {
      display: flex;
      gap: 8px;
    }

    /* ============================================
       ACTIVITY FEED
    ============================================ */

    .activity-list {
      padding: 0;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--gray-100);
      transition: background var(--transition-fast);
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-item:hover {
      background: var(--gray-50);
    }

    .activity-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .activity-icon svg {
      width: 14px;
      height: 14px;
    }

    .activity-icon.call {
      background: var(--info-light);
      color: var(--info);
    }

    .activity-icon.payment {
      background: var(--success-light);
      color: var(--success);
    }

    .activity-icon.reminder {
      background: var(--warning-light);
      color: var(--warning);
    }

    .activity-icon.email {
      background: var(--brand-primary-light);
      color: var(--brand-primary);
    }

    .activity-content {
      flex: 1;
      min-width: 0;
    }

    .activity-text {
      font-size: 13px;
      color: var(--gray-700);
    }

    .activity-text strong {
      font-weight: 600;
      color: var(--gray-900);
    }

    .activity-time {
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 2px;
    }

    /* ============================================
       PROGRESS & CHARTS
    ============================================ */

    .progress-bar {
      height: 6px;
      background: var(--gray-200);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width var(--transition-slow);
    }

    .progress-fill.primary { background: var(--brand-primary); }
    .progress-fill.success { background: var(--success); }
    .progress-fill.warning { background: var(--warning); }
    .progress-fill.danger { background: var(--danger); }

    .stat-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-bar-label {
      width: 100px;
      font-size: 12px;
      color: var(--gray-600);
    }

    .stat-bar-track {
      flex: 1;
      height: 8px;
      background: var(--gray-100);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 4px;
    }

    .stat-bar-value {
      width: 50px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-700);
    }

    /* ============================================
       REMINDER SEQUENCE
    ============================================ */

    .reminder-sequence {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reminder-step {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
    }

    .reminder-step.completed {
      background: var(--success);
      color: white;
    }

    .reminder-step.pending {
      background: var(--gray-200);
      color: var(--gray-500);
    }

    .reminder-step.active {
      background: var(--warning);
      color: white;
    }

    .reminder-connector {
      width: 12px;
      height: 2px;
      background: var(--gray-200);
    }

    .reminder-connector.completed {
      background: var(--success);
    }

    /* ============================================
       CALL QUEUE STATUS
    ============================================ */

    .queue-status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .queue-stat {
      text-align: center;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--gray-50);
    }

    .queue-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .queue-stat-label {
      font-size: 11px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .queue-stat.running {
      background: var(--info-light);
    }

    .queue-stat.running .queue-stat-value {
      color: var(--info);
    }

    /* ============================================
       ESTIMATE BUILDER
    ============================================ */

    .estimate-builder {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .procedure-list {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
    }

    .procedure-item {
      display: grid;
      grid-template-columns: 1fr 100px 100px 40px;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-100);
    }

    .procedure-item:last-child {
      border-bottom: none;
    }

    .estimate-summary {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: sticky;
      top: 24px;
    }

    .estimate-row {

    const API_URL = window.__COLLECTRX_CONFIG__?.apiUrl

    const PRACTICE_ID = window.__COLLECTRX_CONFIG__?.practiceId

      || 'practice_001';

    // Auth token management
    let authToken = sessionStorage.getItem('collectrx_token') || null;

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (authToken) h['Authorization'] = `Bearer ${authToken}`;
      return h;
    }

    // L4: Centralized fetch with error handling + auto-login for demo
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { ...authHeaders(), ...options.headers } });
      if (res.status === 401) {
        const loginRes = await fetch(`${API_URL}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ practiceId: PRACTICE_ID, password: 'demo' })
        });
        if (loginRes.ok) {
          const d = await loginRes.json(); authToken = d.token;
          sessionStorage.setItem('collectrx_token', authToken);
          return fetch(url, { ...options, headers: { ...authHeaders(), ...options.headers } }).then(r => {
            if (!r.ok) throw new Error(`Request failed (${r.status})`);
            return r.json();
          });
        }
        throw new Error('Authentication failed');
      }
      if (!res.ok) { const b = await res.json().catch(() => ({})); throw new Error(b.error || `Request failed (${res.status})`); }
      return res.json();
    }

    const App = () => {

      const [loading, setLoading] = useState(true);
      const [data, setData] = useState(null);
      const [patients, setPatients] = useState([]);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const [dashboardData, patientsData] = await Promise.all([
            api.fetchDashboard(),
            api.fetchPatients({ status: 'all' })
          ]);
          setData(dashboardData);
          setPatients(patientsData.patients || []);
          setLoading(false);
        } catch (error) {
          console.error('Error loading data:', error);
          setLoading(false);
        }
      };

      if (loading) {
        return (
          <div className="loading-state" style={{ height: '100vh' }}>
            <div className="spinner"></div>
            <p style={{ marginTop: '16px' }}>Loading CollectRx...</p>
            <p style={{ marginTop: '8px', fontSize: '12px', color: 'var(--gray-400)' }}>
              Make sure the backend is running on port 3001
            </p>
          </div>
        );
      }

      const renderPage = () => {
        switch (currentPage) {
          case 'dashboard':
            return <DashboardPage data={data} patients={patients} />;
          case 'balances':
            return <BalancesPage patients={patients} />;
          case 'patient-ar':
            return <PatientARPage patients={patients} />;
          case 'estimates':
            return <EstimatesPage />;
          case 'analytics':
            return <AnalyticsPage data={data} />;
          case 'report':
            return <ReportPage />;
          case 'admin':
            return <AdminPage />;
          default:
            return <DashboardPage data={data} patients={patients} />;
        }

      return (

          <main className="main-content">
